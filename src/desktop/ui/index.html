<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastDrop Desktop — Transfert Ultra-Rapide</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-green: #238636;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-bright);
    }
    .status-badge {
      background: #1f6feb22;
      border: 1px solid #1f6feb;
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
    }
    main {
      flex: 1;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .panel h2 {
      margin-top: 0;
      color: var(--text-bright);
      font-size: 1.1rem;
    }
    .peer-list {
      list-style: none;
      padding: 0;
      margin: 12px 0;
      flex: 1;
      overflow-y: auto;
    }
    .peer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .drop-zone:hover {
      border-color: var(--accent);
    }
    .btn {
      background: var(--accent-green);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ FastDrop Desktop</div>
    <div class="status-badge" id="statusBadge">En attente de connexion</div>
  </header>
  <main>
    <section class="panel">
      <h2>Appareils Détectés (Réseau Local)</h2>
      <ul class="peer-list" id="peerList">
        <li class="peer-item">
          <div>
            <strong>Recherche active de pairs...</strong><br>
            <small style="color: #8b949e;">UDP 42424 • Prêt pour appairage PIN/QR</small>
          </div>
        </li>
      </ul>
    </section>
    <section class="panel">
      <h2>Transfert Direct</h2>
      <div class="drop-zone" id="dropZone">
        <p>Glissez-déposez des fichiers ici ou cliquez pour parcourir</p>
        <button class="btn" style="margin-top: 12px;">Sélectionner des fichiers</button>
      </div>
    </section>
  </main>
</body>
</html>
